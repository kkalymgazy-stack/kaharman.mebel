<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Асүй жиһазы | KAHARMAN.MEBEL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #202020;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    color: #222;
    text-decoration: none;
    font-weight: bold;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.gallery img,
.gallery video {
    width: 100%;
    border-radius: 12px;
    display: block;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000015;
}

.card p {
    margin-bottom: 5px;
}

footer {
    background: #202020;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>KAHARMAN.MEBEL</h1>
    <p>Сапалы жиһаз — сіздің үйіңізге</p>
</header>

<div class="container">

<a href="index.html" class="back">← Басты бетке қайту</a>

<h2>Асүй жиһазы</h2>

<p class="description">
Біздің жасаған асүй жиһаздарының жұмыстары
</p>

<div class="gallery">

    <div class="card">
        <img src="asui1.jpg" alt="Асүй жиһазы 1">
        <p>Заманауи стильдегі асүй</p>
    </div>

    <div class="card">
        <img src="asui2.jpg" alt="Асүй жиһазы 2">
        <p>Тапсырыс бойынша жасалған асүй</p>
    </div>

    <div class="card">
        <video controls>
            <source src="video1.mp4" type="video/mp4">
        </video>
        <p>Асүй жобасы — видео</p>
    </div>

    <div class="card">
        <video controls>
            <source src="video2.mp4" type="video/mp4">
        </video>
        <p>Дайын жұмыс</p>
    </div>

    <div class="card">
        <video controls>
            <source src="video3.mp4" type="video/mp4">
        </video>
        <p>Біздің жұмысымыз</p>
    </div>

</div>
</div>

<footer>
    © 2026 KAHARMAN.MEBEL
</footer>

</body>
</html>
